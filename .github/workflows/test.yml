name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    name: Sync engine and room server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:extension

  browser:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium
        id: chromium
        run: echo "path=$(npx --yes @puppeteer/browsers install chromium@latest --path "$HOME/.cache/browsers" | tail -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - run: npm run test:browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/browser/shots/
