name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    name: Sync engine and room server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:extension
      - name: Deploy dry run (bundles and validates without uploading)
        run: npm run check:deploy
      - name: Load test
        run: node scripts/load-test.mjs

  browser:
    name: Browser tests (Chrome, Firefox, HTTPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Chrome for Testing, since plain Chromium builds can't play the H.264 test video.
      - name: Install Chrome
        id: chrome
        run: echo "path=$(npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/browsers" | tail -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Install Firefox
        id: firefox
        run: echo "path=$(npx --yes @puppeteer/browsers install firefox@stable --path "$HOME/.cache/browsers" | tail -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - run: npm run test:browser -- firefox https
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.path }}
          CHROMIUM_PATH: ${{ steps.chrome.outputs.path }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: tests/browser/shots/
